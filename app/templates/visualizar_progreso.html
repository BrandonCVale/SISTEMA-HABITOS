<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Progreso | Hábito.</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
              rel="stylesheet">
        <script src="https://unpkg.com/lucide@latest"></script>
        <link rel="stylesheet"
              href="{{ url_for('static', filename='css/pagina_principal.css') }}">
    </head>
    <body>
        <div class="app-layout">
            <aside class="sidebar">
                <div class="sidebar-top">
                    <div class="brand-logo">
                        <span class="logo-icon">🌿</span>
                        <span class="logo-text">Hábito.</span>
                    </div>
                    <nav class="sidebar-nav">
                        <a href="{{ url_for("pag_principal.inicio") }}" class="nav-item"><i data-lucide="home"></i> Resumen</a>
                        <a href="{{ url_for("habitos.mis_habitos") }}" class="nav-item active"><i data-lucide="check-square"></i> Hábitos</a>
                    </nav>
                </div>
                <div class="sidebar-bottom">
                    <div class="user-profile">
                        <div class="avatar">
                            <div class="avatar-circle">{{ usuario.nombre_usuario[0] | upper if usuario.nombre_usuario else 'U' }}</div>
                        </div>
                        <div class="user-info">
                            <span class="user-name">{{ usuario.nombre_usuario }}</span>
                            <a href="{{ url_for("auth.cerrar_sesion") }}" class="link-logout">Cerrar sesión</a>
                        </div>
                    </div>
                </div>
            </aside>
            <main class="main-content">
                <header class="page-header" style="margin-bottom: 20px;">
                    <div>
                        <h1>Análisis del hábito: {{ habito.nombre }}</h1>
                        <p class="subtitle">Monitorea tu constancia en los últimos 15 días</p>
                    </div>
                </header>
                <section class="card">
                    {{ grafica_html | safe }}
                </section>
            </main>
        </div>
        <script>lucide.createIcons();</script>
    </body>
</html>
